<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <title>Anomaly Detection</title>

    <style>

        body {
            font-family: Arial, sans-serif;
            background: #f4f6f8;
        }

        .container {
            width: 90%;
            max-width: 700px;
            margin: 50px auto;
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 3px 10px rgba(0,0,0,0.1);
        }

        .result {
            margin-top: 20px;
            padding: 15px;
            background: #f1f1f1;
            border-radius: 8px;
        }

        button {
            padding: 12px 20px;
            background: #dc3545;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
        }

    </style>

</head>

<body>

<div class="container">

    <h1>Anomaly Detection</h1>

    <p>
        The system checks donation activity for
        unusual patterns.
    </p>

    <form method="POST">

        <button type="submit">
            Check Anomaly
        </button>

    </form>


    {% if result %}

    <div class="result">

        <h2>Analysis Result</h2>

        <p>{{ result }}</p>

    </div>

    {% endif %}

</div>

</body>

</html>
